name = "dropitover"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The workers.dev address keeps working alongside the custom domain. Set this to
# false once nobody is using it.
workers_dev = true

# Custom domain. Cloudflare creates the DNS records and the certificate itself,
# but the zone has to be active on this account first: deploying before the
# nameservers have moved fails with "could not find zone".
routes = [
  { pattern = "dropitover.com", custom_domain = true },
  { pattern = "www.dropitover.com", custom_domain = true },
]

# The frontend ships as static assets. Requests that don't match a file fall
# through to the Worker, which serves /r/* and /d/* and the API.
[assets]
directory = "./public"
binding = "ASSETS"
# Static files are normally served before the Worker runs, which meant the
# canonical redirect only fired on paths listed here -- every other page
# (privacy, terms, guides, comparisons) stayed reachable over http:// and
# www., which is both a broken secure-context and duplicate-content problem.
# Routing every request through the Worker first fixes that; the fetch
# handler still falls through to the asset layer for anything it doesn't
# handle itself, so this costs a Worker invocation per request, not a slower
# response.
run_worker_first = true

# --- Mode 2 storage ---------------------------------------------------------
# Encrypted file bodies live in R2; metadata and expiry live in D1.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dropitover-files"

[[d1_databases]]
binding = "DB"
database_name = "dropitover"
database_id = "585a5186-eaff-47c5-947a-c7be10f9adae"

# --- Signaling (Modes 1 and 3) ----------------------------------------------
# NetworkHub: one instance per hashed public IP, for same-network discovery.
# Room: one instance per room id.
[[durable_objects.bindings]]
name = "NETWORK_HUB"
class_name = "NetworkHub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects — available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NetworkHub", "Room"]

# --- Expiry sweeper ---------------------------------------------------------
[triggers]
crons = ["*/10 * * * *"]

[vars]
# The one address the site should be reached on. http, www and any other host
# that still serves the app redirect here. Leave empty to disable redirects
# (useful before a domain is attached).
CANONICAL_HOST = "dropitover.com"
# Bytes. 2 GB per file by default; uploads are chunked so this is not capped by
# the Workers request-body limit.
MAX_FILE_SIZE = "2147483648"
MAX_TOTAL_SIZE = "8589934592"
MAX_TEXT_LENGTH = "200000"
# Upload/encryption chunk size in bytes. Must be >= 5 MiB (R2 multipart minimum)
# and comfortably under the Workers request-body limit.
PART_SIZE = "8388608"
DEFAULT_EXPIRY = "24h"
# Per-IP daily caps on link shares (Mode 2 only — peer-to-peer transfers are
# never metered). Set either to "0" to disable that cap.
DAILY_SHARE_LIMIT = "10"
DAILY_BYTE_LIMIT = "5368709120"
ROOM_TTL_SECONDS = "43200"
ROOM_MAX_PARTICIPANTS = "8"
STUN_URLS = "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
TURN_URLS = ""
TURN_USERNAME = ""

# Secrets — set with `npx wrangler secret put <NAME>`, never in this file:
#   MASTER_KEY      64 hex chars; AES-256-GCM root key for files at rest
#   TURN_KEY_ID     Cloudflare Realtime TURN key id  } short-lived relay
#   TURN_API_TOKEN  its API token                    } credentials, see README
#   TURN_CREDENTIAL static TURN password, only if you self-host coturn instead
